name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x", "24.x", "26.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test built package
        run: npm run test:package

      - name: Pack dry run
        run: npm pack --dry-run

  framework-compatibility:
    name: Framework ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [langchain-minimum, deepagents-minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Install minimum standalone LangChain
        if: matrix.framework == 'langchain-minimum'
        run: npm install --ignore-scripts --no-save --package-lock=false --legacy-peer-deps @langchain/core@0.3.80
      - name: Test minimum standalone LangChain
        if: matrix.framework == 'langchain-minimum'
        run: npx vitest run test/langchain.test.ts test/langchain-minimum.test.ts
      - name: Install minimum agent dependencies
        if: matrix.framework == 'deepagents-minimum'
        run: npm install --ignore-scripts --no-save --package-lock=false @langchain/core@1.2.14 @langchain/langgraph@1.4.10 @langchain/langgraph-sdk@1.9.23 @langchain/anthropic@1.5.12 @langchain/openai@1.6.2 langchain@1.5.10 deepagents@1.16.0
      - name: Install current compatible agent dependencies
        if: matrix.framework == 'current'
        run: npm install --ignore-scripts --no-save --package-lock=false '@langchain/core@latest' '@langchain/langgraph@^1.4.10' 'langchain@^1.5.10' 'deepagents@>=1.16.0 <1.17.0'
      - name: Test actual agent and graph integrations
        if: matrix.framework != 'langchain-minimum'
        run: npx vitest run test/langchain-minimum.test.ts test/thread-identity.test.ts test/deepagents-graph.test.ts test/deepagents-remote.test.ts test/deepagents.test.ts test/langchain.test.ts

  vercel-ai-v3-compatibility:
    name: Vercel AI ${{ matrix.ai-version }} v3 adapter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ai-version: ["5.0.286", "6.0.191"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Install retained AI SDK release
        run: npm install --ignore-scripts --no-save --package-lock=false --legacy-peer-deps ai@${{ matrix.ai-version }}
      - name: Test existing v3 adapter
        run: npx vitest run test/vercel.test.ts
      - name: Build all package exports
        run: npm run build

  vercel-ai-v4-contract:
    name: Vercel AI 7.0.166 v4 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Build dual-format package
        run: npm run build
      - name: Install exact AI SDK 7 contracts
        run: npm install --ignore-scripts --no-save --package-lock=false --legacy-peer-deps ai@7.0.166 @ai-sdk/provider@4.0.37
      - name: Check actual LanguageModelV4 middleware assignment
        run: npm run typecheck:ai7
      - name: Exercise AI SDK 7 generateText without inference
        run: node test/ai7-contract/generate-text.mjs
      - name: Verify bounded interleaved Block-mode memory
        run: node test/ai7-contract/vercel-v4-memory.mjs
